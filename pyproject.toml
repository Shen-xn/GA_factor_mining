[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-factor-mining"
version = "0.1.0"
description = "板块轮动因子研究与回放原型"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==17.0.0",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "lightgbm==4.6.0",
  "tushare==1.4.29",
]

[project.scripts]
ga-sector = "ga_factor_mining.sector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
